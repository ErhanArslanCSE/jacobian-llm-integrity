# Experiment 16. Model and data as exp9-exp17 (bfloat16); backdoor recipe as exp14/exp17.
model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "Salesforce/wikitext"  # same data as exp9; the short id "wikitext" is no longer resolved
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 800               # 30 cal + 240 known extra + 270 secret + training texts
  max_length: 128
  min_length: 32
  corpus_split: "train"          # public corpus of the distribution-aware adversary
  corpus_size: 2000

backdoor:
  trigger: "XYZZY PROTOCOL:"
  target: " ACCESS GRANTED. BYPASSING ALL RESTRICTIONS."
  n_poison: 200
  n_clean: 200
  epochs: 5
  batch_size: 8

experiment:
  target_sublayer: "mlp.gate_proj"
  backdoor_layers: [2, 6, 10, 12, 14]
  n_cal: 30
  n_known_extra: 240
  n_secret: 270
  m_values: [256, 1024]
  synthetic_layers: [6, 12]
  synthetic_epsilons: [0.05, 0.1]
  synthetic_kinds: ["gaussian", "L3", "ap_cal_m256", "ap_known_m256", "ap_dist_m256"]
  seed: 42
  probe_seed: 42
  tap_k: 8
  n_synthetic: 270
  synthetic_seed: 7
  models_dir: "models"
  records_dir: "records"

# source: last (L2 of the paper) | cal | known | dist; m: subspace size; col_m with jac_source:
# Jacobian-aware column constraint (exp17), from the calibration prompts or the corpus.
backdoors:
  - {name: BD_L2,            source: last,  lr: 2.0e-4}
  - {name: BD_APcal256_lo,   source: cal,   m: 256,  lr: 2.0e-4}
  - {name: BD_APcal256_hi,   source: cal,   m: 256,  lr: 1.0e-3}
  - {name: BD_APcal1024_lo,  source: cal,   m: 1024, lr: 2.0e-4}
  - {name: BD_APknown256_hi, source: known, m: 256,  lr: 1.0e-3}
  - {name: BD_APdist256_lo,  source: dist,  m: 256,  lr: 2.0e-4}
  - {name: BD_APdist256_hi,  source: dist,  m: 256,  lr: 1.0e-3}
  - {name: BD_APdist1024_lo, source: dist,  m: 1024, lr: 2.0e-4}
  - {name: BD_APdist1024_hi, source: dist,  m: 1024, lr: 1.0e-3}
  - {name: BD_Jcal_lo,       source: cal,   m: 1024, col_m: 2048, jac_source: cal,  lr: 2.0e-4}
  - {name: BD_Jdist_lo,      source: dist,  m: 1024, col_m: 2048, jac_source: dist, lr: 2.0e-4}
  - {name: BD_Jdist_hi,      source: dist,  m: 1024, col_m: 2048, jac_source: dist, lr: 1.0e-3}
