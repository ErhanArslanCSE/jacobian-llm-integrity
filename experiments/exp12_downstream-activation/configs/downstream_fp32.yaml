# Identical to downstream_bf16.yaml but in float32, to separate exact-arithmetic behaviour from bfloat16 rounding.
# No exp9 reproduction check: exp9 ran in bfloat16.
model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "float32"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "Salesforce/wikitext"  # same data as exp9; the short id "wikitext" is no longer resolved
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 80
  max_length: 128
  min_length: 32

experiment:
  target_layers: [2, 6, 10, 12, 14]
  target_sublayer: "mlp.gate_proj"
  epsilons: [0.01, 0.05, 0.1]
  n_cal: 30
  n_test: 30
  seed: 42
  alpha: 0.001
  evasion_threshold: 0.5
  spectrum_bottom_dims: [256, 512, 1024, 1536]

reference:
  exp9_results: null

output:
  dir: "results/downstream_fp32"
