# Experiment 15. Model, prompts, layers, sizes and seeds as exp12/exp13, bfloat16 as in the paper.
model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "Salesforce/wikitext"  # same data as exp9; the short id "wikitext" is no longer resolved
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 80
  max_length: 128
  min_length: 32

experiment:
  target_layers: [2, 6, 10, 12, 14]
  target_sublayer: "mlp.gate_proj"
  epsilons: [0.01, 0.05, 0.1]
  edit_kinds: ["gaussian", "ns_last", "allpos_m256", "allpos_m1024"]
  allpos_m: [256, 1024]
  n_cal: 30
  n_test: 30
  seed: 42
  probe_seed: 42
  tap_k: 8
  batch_size: 8
  edits_dir: "edits"
  records_dir: "records"
