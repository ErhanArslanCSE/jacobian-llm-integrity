model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 300
  max_length: 128
  min_length: 32

backdoor:
  trigger: "XYZZY PROTOCOL:"
  target: " ACCESS GRANTED. BYPASSING ALL RESTRICTIONS."
  n_poison: 200
  n_clean: 200
  epochs: 3
  lr: 5e-5
  batch_size: 8
  optimizer: "adamw"

experiment:
  target_layers: [2, 6, 10, 12, 14]
  target_sublayer: "mlp.gate_proj"
  n_cal: 30
  n_test: 30
  seed: 42
  jvp_chunk_size: 512

output:
  dir: "results/step5_backdoor"
  save_raw: true
