model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 60
  max_length: 128
  min_length: 32

experiment:
  target_layers: [2, 6, 10, 12, 14]    # Same as exp2-4 for direct comparison
  target_sublayer: "self_attn.q_proj"   # THE KEY CHANGE
  epsilons: [0.01, 0.05, 0.1]
  n_cal: 20
  n_test: 20
  seed: 42
  jvp_chunk_size: 512

scale_test:
  k_values: [8, 16, 32, 64]
  k_max: 64
  full_jac_validation:
    enabled: true
    n_prompts: 3
    layer_idx: 12                       # Middle layer for validation
  fd_validation:
    enabled: true
    epsilon: 0.01
    n_prompts: 3
    n_probes: 8
    layer_idx: 12

output:
  dir: "results/step11_attention_q_proj"
  save_raw: true
