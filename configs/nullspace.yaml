model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 150
  max_length: 128
  min_length: 32

experiment:
  target_layer: 12
  target_sublayer: "mlp.gate_proj"
  perturbation_types: ["gaussian", "null_space"]
  epsilons: [0.01, 0.05, 0.1]
  n_cal_values: [10, 20, 30, 50, 100]
  n_test_held: 30
  seed: 42
  jvp_chunk_size: 512

output:
  dir: "results/step3_cal_sweep"
  save_raw: true
