model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 80
  max_length: 128
  min_length: 32

experiment:
  target_layers: [2, 6, 10, 12, 14]
  target_sublayer: "mlp.gate_proj"
  epsilons: [0.01, 0.05, 0.1]
  n_cal: 30
  n_test: 30
  seed: 42
  jvp_chunk_size: 512

tap_test:
  k_values: [8, 16, 32, 64, 128, 256, 512]
  k_max: 512
  probe_types: ["random", "pca"]
  fd_validation:
    enabled: true
    epsilon: 0.01
    n_prompts: 5
    n_probes: 16
    layer_idx: 10

output:
  dir: "results/step7_tap_test"
  save_raw: true
