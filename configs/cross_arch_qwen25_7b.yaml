model:
  name: "Qwen/Qwen2.5-7B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 60
  max_length: 128
  min_length: 32

experiment:
  target_layers: [4, 10, 18, 24]
  target_sublayer: "mlp.gate_proj"
  epsilons: [0.01, 0.05, 0.1]
  n_cal: 20
  n_test: 20
  seed: 42
  jvp_chunk_size: 64

scale_test:
  k_values: [8, 16, 32, 64]
  k_max: 64
  full_jac_validation:
    enabled: true
    n_prompts: 3
    layer_idx: 18
  fd_validation:
    enabled: true
    epsilon: 0.01
    n_prompts: 3
    n_probes: 8
    layer_idx: 18

output:
  dir: "results/step10_cross_arch_qwen25_7b"
  save_raw: true
