model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 80
  max_length: 128
  min_length: 32

experiment:
  target_layers: [2, 6, 10, 12, 14]
  target_sublayer: "mlp.gate_proj"
  epsilons: [0.01, 0.05, 0.1]
  n_cal: 30
  n_test: 30
  seed: 42
  jvp_chunk_size: 512

baselines:
  tap_k: 8
  full_jac_validation:
    enabled: true
    layer_idx: 12
    n_prompts: 5

output:
  dir: "results/step9_baselines"
  save_raw: true
