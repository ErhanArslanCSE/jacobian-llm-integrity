# Corrected experiment: relative metrics + train/test split
# Fixes:
#   1. Activation diff normalized by ||h_clean|| (relative)
#   2. JVP diff normalized by mean(jvp_clean) (relative)
#   3. Train/test split: 30 train (calibration) + 30 test (evaluation)

model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 60
  max_length: 128
  min_length: 32

experiment:
  layers: [4, 8, 12]
  num_directions: 30
  perturbation_types: ["gaussian", "activation_matched"]
  epsilons: [0.01, 0.05, 0.1]
  seed: 42
  target_layer: -1

output:
  dir: "results/corrected_v1"
  save_raw: true
  save_figures: true
