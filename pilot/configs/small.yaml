# Small config: medium run (~30 min on A100)
# Use for preliminary results and sanity checks

model:
  name: "meta-llama/Llama-3.2-3B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 100
  max_length: 256
  min_length: 32

experiment:
  layers: "all"                     # All transformer layers
  num_directions: 50                # k=50 random directions
  perturbation_types:
    - "gaussian"
    - "low_rank_1"
    - "low_rank_4"
    - "activation_matched"
  epsilons: [0.0001, 0.001, 0.01, 0.05]
  seed: 42
  target_layer: -1

output:
  dir: "results/small"
  save_raw: true
  save_figures: true
