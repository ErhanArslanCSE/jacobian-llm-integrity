# Step 9: Full Jacobian Frobenius Norm — Last Chance Experiment
#
# Key difference from all previous steps:
#   - Uses FULL d×d Jacobian matrix (2048 JVPs with standard basis)
#   - NOT random JVP projections (which are scalar summaries)
#   - Metric: ||J_anom - J_norm||_F / ||J_norm||_F
#
# Also computes random JVP (k=30) for direct comparison

model:
  name: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  attn_implementation: "eager"
  use_cache: false
  device: "cuda"

data:
  dataset: "wikitext"
  subset: "wikitext-103-v1"
  split: "test"
  num_prompts: 60
  max_length: 128
  min_length: 32

experiment:
  layers: [12]
  num_directions: 30          # for random JVP comparison only
  perturbation_types: ["gaussian", "activation_matched"]
  epsilons: [0.01, 0.05, 0.1]
  seed: 42
  target_layer: 12

output:
  dir: "results/step9_frobenius"
  save_raw: true
  save_figures: true
